<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>anyProxy</title>
  <link rel="stylesheet" href="/ui/app.css">
</head>
<body>
  <div class="aura" aria-hidden="true"><i class="a1"></i><i class="a2"></i><i class="a3"></i></div>

  <aside class="rail" id="rail" hidden>
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
        <path d="M9 1.5 15.5 5v8L9 16.5 2.5 13V5L9 1.5Z" stroke="currentColor" stroke-width="1.4"/>
        <path d="M9 5.5v7M5.8 7.3 9 9l3.2-1.7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <b data-t="ui-title"></b>
    </div>
    <nav class="nav" id="nav">
      <a href="#/dashboard" data-view="dashboard">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1.5" stroke="currentColor" stroke-width="1.3"/><rect x="9" y="1.5" width="5.5" height="5.5" rx="1.5" stroke="currentColor" stroke-width="1.3"/><rect x="1.5" y="9" width="5.5" height="5.5" rx="1.5" stroke="currentColor" stroke-width="1.3"/><rect x="9" y="9" width="5.5" height="5.5" rx="1.5" stroke="currentColor" stroke-width="1.3"/></svg>
        <span data-t="ui-nav-dashboard"></span>
      </a>
      <a href="#/nodes" data-view="nodes" data-needs="nodes">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="1.5" y="2" width="13" height="4.5" rx="1.5" stroke="currentColor" stroke-width="1.3"/><rect x="1.5" y="9.5" width="13" height="4.5" rx="1.5" stroke="currentColor" stroke-width="1.3"/><circle cx="4.5" cy="4.25" r="0.9" fill="currentColor"/><circle cx="4.5" cy="11.75" r="0.9" fill="currentColor"/></svg>
        <span data-t="ui-nav-nodes"></span>
      </a>
      <a href="#/users" data-view="users">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="5" r="3" stroke="currentColor" stroke-width="1.3"/><path d="M2.5 14c.6-3 2.7-4.5 5.5-4.5s4.9 1.5 5.5 4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        <span data-t="ui-nav-users"></span>
      </a>
      <a href="#/log" data-view="log" data-needs="audit">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 2.5h10v11H3z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M5.5 6h5M5.5 8.5h5M5.5 11h3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        <span data-t="ui-nav-log"></span>
      </a>
    </nav>
    <div class="grow"></div>
    <div class="rfoot">
      <div class="frow"><span class="k mono" id="me-login"></span><span class="v" id="me-role"></span></div>
      <div class="frow"><span class="k" data-t="ui-language"></span>
        <span class="seg" id="lang"><button type="button" data-lang="ru">RU</button><button type="button" data-lang="en">EN</button></span></div>
      <div class="frow"><span class="k" data-t="ui-theme"></span>
        <span class="seg" id="theme"><button type="button" data-theme="dark" data-t="ui-theme-dark"></button><button type="button" data-theme="light" data-t="ui-theme-light"></button></span></div>
      <button type="button" class="btn ghost" id="sign-out" data-t="ui-sign-out"></button>
    </div>
  </aside>

  <main class="main" id="main"></main>
  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="/ui/app.js"></script>
</body>
</html>
