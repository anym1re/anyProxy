# The secret scan, over the whole history.
when:
  - event: [push, pull_request, manual]
    branch: [dev, main]

clone:
  - name: git
    image: docker.io/woodpeckerci/plugin-git
    settings:
      partial: false

steps:
  # The version is pinned rather than "latest": a scanner that changes under
  # you turns a green history into a surprise. Bump it deliberately.
  - name: gitleaks
    image: docker.io/library/debian:trixie-slim
    commands:
      # git among them: the scan walks the history by running git, and the
      # image has none. Without it the step fails before it reads a line.
      - apt-get update -qq && apt-get install -y -qq curl ca-certificates tar git >/dev/null
      - curl -fsSL -o /tmp/gitleaks.tar.gz
          https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
      - tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
      - gitleaks version
      - gitleaks detect --source . --config .gitleaks.toml --redact --no-banner
