# The tests that need a database: the store, the panel and the command line.
when:
  - event: [push, pull_request, manual]
    branch: [dev, main]

services:
  - name: postgres
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: anyproxy
      POSTGRES_PASSWORD: anyproxy
      POSTGRES_DB: anyproxy

steps:
  - name: store-panel-cli
    image: docker.io/library/rust:1.98.0
    environment:
      DATABASE_URL: postgres://anyproxy:anyproxy@postgres:5432/anyproxy
    commands:
      # A started service is not yet a listening one, and there is nothing here
      # that waits for one. Bounded on purpose: a database that never arrives
      # should say so, not hold the run until something else times it out.
      - bash -c 'for _ in $(seq 1 60); do (exec 3<>/dev/tcp/postgres/5432) 2>/dev/null && exit 0; sleep 1; done; echo "postgres never came up"; exit 1'
      - cargo test -p ap-store -p ap-cli -p ap-panel --locked
