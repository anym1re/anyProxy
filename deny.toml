[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # Covers the Mozilla root certificate set carried by webpki-roots: a data
    # set under a permissive data licence, not code.
    "CDLA-Permissive-2.0",
]

# The workspace crates carry no license field yet and are never published.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A path dependency inside this workspace carries no version and is not a
# supply-chain risk: it is this repository.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
