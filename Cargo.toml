[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
repository = "https://github.com/anym1re/anyProxy"
publish = false

[workspace.dependencies]
aes = "0.8"
argon2 = "0.5"
ctr = "0.9"
axum = { version = "0.8", features = ["json", "query", "tokio", "http1"], default-features = false }
chacha20poly1305 = "0.10"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
fluent = "0.17"
hex = "0.4"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
hmac = "0.12"
rand = "0.9"
sha2 = "0.10"
subtle = "2"
proptest = "1"
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "time", "json"] }
thiserror = "2"
totp-rs = { version = "5", default-features = false }
unic-langid = { version = "0.9", features = ["macros"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
uuid = { version = "1", features = ["v7", "serde"] }
zeroize = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
