name: release

on:
  push:
    tags: ["v*"]
  # So the whole path can be walked before it matters. A release workflow whose
  # first run is the release is a workflow nobody has ever seen work, and the
  # thing it would fail on is a tag that cannot be taken back.
  workflow_dispatch:

permissions:
  contents: write
  # Signing without a key we have to keep: the certificate is issued to this
  # workflow on this tag, and that is what the installer checks against.
  id-token: write

jobs:
  build:
    name: build and sign
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            name: x86_64-linux-musl
          - target: aarch64-unknown-linux-musl
            name: aarch64-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add ${{ matrix.target }}
      - run: cargo install cross --locked --version 0.2.5
      - run: cross build --release --locked --target ${{ matrix.target }} -p ap-agent -p ap-panel -p ap-cli

      - name: name the artefacts
        run: |
          mkdir -p out
          cp target/${{ matrix.target }}/release/anyproxy-agent out/anyproxy-agent-${{ matrix.name }}
          cp target/${{ matrix.target }}/release/anyproxy-panel out/anyproxy-panel-${{ matrix.name }}
          cp target/${{ matrix.target }}/release/anyproxy out/anyproxy-${{ matrix.name }}
          cd out && sha256sum * > SHA256SUMS-${{ matrix.name }}

      - uses: sigstore/cosign-installer@v3
      - name: sign each artefact
        run: |
          for file in out/anyproxy-*-${{ matrix.name }} out/SHA256SUMS-${{ matrix.name }}; do
            cosign sign-blob --yes --bundle "${file}.bundle" "${file}"
          done

      # Only a tag publishes. A rehearsal builds and signs and stops there.
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: out/*
          fail_on_unmatched_files: true

      - name: keep the rehearsal where it can be looked at
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: rehearsal-${{ matrix.name }}
          path: out/*
