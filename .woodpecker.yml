# The checks that must pass. Written for Woodpecker 2.x/3.x: list-form steps, a
# top-level `when`, and `services`. Steps run in order and share one clone.

when:
  - event: [push, pull_request, manual]
    branch: [dev, main]

# gitleaks reads the commit history, so the clone must carry it rather than the
# shallow default.
clone:
  - name: git
    image: docker.io/woodpeckerci/plugin-git
    settings:
      partial: false

services:
  - name: postgres
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: anyproxy
      POSTGRES_PASSWORD: anyproxy
      POSTGRES_DB: anyproxy

steps:
  # The pinned toolchain is the image's default, so rust-toolchain.toml adds no
  # download. --locked holds every crate to what Cargo.lock records.
  - name: fmt-clippy-test
    image: docker.io/library/rust:1.98.0
    commands:
      - rustc --version && cargo --version
      - cargo fmt --all -- --check
      - cargo clippy --all-targets --all-features --locked -- -D warnings
      - cargo test --all --all-features --locked

  - name: conventions
    image: docker.io/library/debian:trixie-slim
    commands:
      - apt-get update -qq && apt-get install -y -qq bash >/dev/null
      - bash scripts/test-conventions.sh
      - bash scripts/check-conventions.sh .

  # systemd-analyze and cosign are read when present and their absence is
  # handled by the script itself, so a plain image is enough.
  - name: deploy
    image: docker.io/library/debian:trixie-slim
    commands:
      - apt-get update -qq && apt-get install -y -qq bash coreutils >/dev/null
      - bash scripts/check-deploy.sh

  # The published binary rather than a build of it: compiling the checker took
  # minutes and the memory of a small agent, to arrive at the same bytes.
  - name: deny
    image: docker.io/library/rust:1.98.0
    commands:
      - curl -fsSL -o /tmp/cargo-deny.tar.gz
          https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
      - tar -xzf /tmp/cargo-deny.tar.gz --strip-components=1 -C /usr/local/bin
          cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny
      - cargo-deny check

  # The version is pinned rather than "latest": a scanner that changes under
  # you turns a green history into a surprise. Bump it deliberately.
  - name: secrets
    image: docker.io/library/debian:trixie-slim
    commands:
      - apt-get update -qq && apt-get install -y -qq curl ca-certificates tar >/dev/null
      - curl -fsSL -o /tmp/gitleaks.tar.gz
          https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
      - tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
      - gitleaks detect --source . --config .gitleaks.toml --redact --no-banner

  - name: store-panel-cli
    image: docker.io/library/rust:1.98.0
    environment:
      DATABASE_URL: postgres://anyproxy:anyproxy@postgres:5432/anyproxy
    commands:
      # A started service is not yet a listening one, and there is nothing here
      # that waits for one. Bounded on purpose: a database that never arrives
      # should say so, not hold the run until something else times it out.
      - bash -c 'for _ in $(seq 1 60); do (exec 3<>/dev/tcp/postgres/5432) 2>/dev/null && exit 0; sleep 1; done; echo "postgres never came up"; exit 1'
      - cargo test -p ap-store -p ap-cli -p ap-panel --locked

  # The digest in deploy/telemt.pin decides which engine this is, and the
  # script refuses anything else.
  - name: engine
    image: docker.io/library/rust:1.98.0
    commands:
      - apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null
      - export ANYPROXY_TELEMT="$(bash scripts/fetch-telemt.sh)"
      - cargo test -p ap-engine --locked
